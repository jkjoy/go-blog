services:
  blog:
    image: ${BLOG_IMAGE:-ghcr.io/jkjoy/go-blog}:${BLOG_VERSION:-latest}
    build:
      context: .
      args:
        VERSION: ${BLOG_VERSION:-dev}
    restart: unless-stopped
    init: true
    ports:
      - "${BLOG_PORT:-8080}:8080"
    environment:
      BLOG_LISTEN: 0.0.0.0:8080
      BLOG_DATABASE_DRIVER: ${BLOG_DATABASE_DRIVER:-sqlite}
      BLOG_DATABASE_DSN: ${BLOG_DATABASE_DSN:-/app/data/blog.sqlite}
      BLOG_SCHEMA_MODE: ${BLOG_SCHEMA_MODE:-validate}
      BLOG_UPLOAD_DIR: /app/uploads
      BLOG_SESSION_SECRET: ${BLOG_SESSION_SECRET:?Set BLOG_SESSION_SECRET before starting}
      BLOG_SECURE_COOKIES: ${BLOG_SECURE_COOKIES:-false}
      BLOG_LOG_LEVEL: ${BLOG_LOG_LEVEL:-info}
    volumes:
      - blog-data:/app/data
      - blog-uploads:/app/uploads
    read_only: true
    tmpfs:
      - /tmp:size=64m,mode=1777
    security_opt:
      - no-new-privileges:true
    stop_grace_period: 15s

volumes:
  blog-data:
  blog-uploads:
