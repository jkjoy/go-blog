{{define "auth"}}
<!doctype html><html lang="zh-CN" data-theme="dark"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#080a12"><title>登录 · {{.Settings.Name}}</title><link rel="stylesheet" href="/static/nebula.css?v={{.Version}}"><script>try{var t=localStorage.getItem('nebula-theme');if(t)document.documentElement.dataset.theme=t}catch(e){}</script></head>
<body><canvas id="stars" aria-hidden="true"></canvas><div class="aurora" aria-hidden="true"><i></i><i></i><i></i></div><main class="auth-shell"><a class="brand auth-brand" href="/">{{.Settings.Name}}</a><section class="auth-panel reveal"><p class="eyebrow">MEMBER ACCESS</p><h1>登录</h1><p>登录后参与评论与站点互动。</p>{{if .Error}}<div class="form-error" role="alert">{{.Error}}</div>{{end}}<form method="post"><label>用户名<input name="username" maxlength="191" autocomplete="username" autofocus required></label><label>密码<input type="password" name="password" autocomplete="current-password" required></label><button class="primary-button" type="submit">登录</button></form></section></main><script src="/static/nebula.js?v={{.Version}}" defer></script></body></html>
{{end}}
